[package]
name = "RustOhkanGame"
version = "0.1.0"
authors = ["tobisako <tobisako@gmail.com>"]
edition = "2021"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }

[patch.crates-io]
miniquad = { path = "vendor/miniquad" }

# Android APK (cargo quad-apk build --release)
[package.metadata.android]
# 末尾セグメントは loadLibrary されるライブラリ名 = クレート名と一致必須 (quad-apk仕様)
package_name = "com.tobisako.RustOhkanGame"
label = "OhkanGame"
assets = "assets"
build_targets = ["aarch64-linux-android"]
android_version = 33
target_sdk_version = 33
min_sdk_version = 24
version_code = 1
version_name = "1.0"
fullscreen = true
opengles_version_major = 2
opengles_version_minor = 0

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "portrait"
"android:exported" = "true"
